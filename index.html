    <script>
      (function() {
        function isExternalIgnoredError(err) {
          if (!err) return false;
          var msg = (err.message || String(err)).toLowerCase();
          var stack = (err.stack || '').toLowerCase();
          var patterns = [
            'failed to fetch',
            'networkerror',
            'load failed',
            'timed out',
            'timeout',
            'request timed out',
            'tpemd',
            'cascoon',
            'travelpayouts',
            'hotellook',
            'aviasales',
            'airhelp',
            'script error'
          ];
          for (var i = 0; i < patterns.length; i++) {
            if (msg.indexOf(patterns[i]) !== -1 || stack.indexOf(patterns[i]) !== -1) {
              return true;
            }
          }
          return false;
        }

        window.addEventListener('unhandledrejection', function(event) {
          if (event && isExternalIgnoredError(event.reason)) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          if (event && (isExternalIgnoredError(event.error) || isExternalIgnoredError(event.message))) {
            event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
